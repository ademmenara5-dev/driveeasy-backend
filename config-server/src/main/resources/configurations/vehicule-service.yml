server:
  port: 8081

spring:
  application:
    name: vehicule-service

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

driveeasy:
  vehicule:
    default-currency: EUR
    max-allowed-year-delta: 0
